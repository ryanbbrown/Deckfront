<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#111}.title{font-size:30px;font-weight:700}.head{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#444}.arrow{stroke:#333;stroke-width:3;fill:none;marker-end:url(#arrow)}.box{fill:#fff;stroke:#222;stroke-width:2}.soft{fill:#f4f4f4;stroke:#777;stroke-width:1.5}.strategy{stroke:#222;stroke-width:2}.weight{font-size:17px;font-weight:700}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#fff"/>
  <text x="40" y="48" class="title">PSRO: search against a weighted lottery of strategies</text>
  <text x="40" y="78" class="body">No manual melee/ranged families. Each circle is one complete strategy.</text>

  <!-- Round start -->
  <text x="40" y="130" class="head">1. Automatic starting set</text>
  <rect x="40" y="150" width="270" height="170" rx="8" class="box"/>
  <text x="60" y="180" class="body">Generate legal strategies automatically</text>
  <text x="60" y="204" class="small">Example: 20 random strategies</text>
  <g class="strategy">
    <circle cx="75" cy="245" r="16" fill="#ef7770"/><circle cx="115" cy="245" r="16" fill="#66a9e8"/><circle cx="155" cy="245" r="16" fill="#ad86e8"/><circle cx="195" cy="245" r="16" fill="#e5c95d"/><circle cx="235" cy="245" r="16" fill="#70caa9"/><circle cx="275" cy="245" r="16" fill="#e891bb"/>
    <circle cx="75" cy="285" r="16" fill="#8dc5d3"/><circle cx="115" cy="285" r="16" fill="#d9936d"/><circle cx="155" cy="285" r="16" fill="#8bbd6a"/><circle cx="195" cy="285" r="16" fill="#c17c91"/><circle cx="235" cy="285" r="16" fill="#7f92d7"/><circle cx="275" cy="285" r="16" fill="#b9a26a"/>
  </g>
  <text x="175" y="310" text-anchor="middle" class="small">No five hand-written seeds required</text>

  <path d="M315 235 H390" class="arrow"/>

  <!-- Matrix -->
  <text x="405" y="130" class="head">2. Matchup matrix</text>
  <rect x="405" y="150" width="270" height="170" rx="8" class="box"/>
  <text x="425" y="180" class="small">Rows play columns</text>
  <g transform="translate(455 200)">
    <rect x="0" y="0" width="40" height="32" fill="#ddd"/><rect x="40" y="0" width="40" height="32" fill="#bde5cc"/><rect x="80" y="0" width="40" height="32" fill="#f0c1c1"/><rect x="120" y="0" width="40" height="32" fill="#bde5cc"/>
    <rect x="0" y="32" width="40" height="32" fill="#f0c1c1"/><rect x="40" y="32" width="40" height="32" fill="#ddd"/><rect x="80" y="32" width="40" height="32" fill="#bde5cc"/><rect x="120" y="32" width="40" height="32" fill="#bde5cc"/>
    <rect x="0" y="64" width="40" height="32" fill="#bde5cc"/><rect x="40" y="64" width="40" height="32" fill="#f0c1c1"/><rect x="80" y="64" width="40" height="32" fill="#ddd"/><rect x="120" y="64" width="40" height="32" fill="#f0c1c1"/>
    <rect x="0" y="96" width="40" height="32" fill="#f0c1c1"/><rect x="40" y="96" width="40" height="32" fill="#f0c1c1"/><rect x="80" y="96" width="40" height="32" fill="#bde5cc"/><rect x="120" y="96" width="40" height="32" fill="#ddd"/>
    <text x="20" y="22" text-anchor="middle" class="small">—</text><text x="60" y="22" text-anchor="middle" class="small">70</text><text x="100" y="22" text-anchor="middle" class="small">35</text><text x="140" y="22" text-anchor="middle" class="small">65</text>
    <text x="20" y="54" text-anchor="middle" class="small">30</text><text x="60" y="54" text-anchor="middle" class="small">—</text><text x="100" y="54" text-anchor="middle" class="small">60</text><text x="140" y="54" text-anchor="middle" class="small">55</text>
    <text x="20" y="86" text-anchor="middle" class="small">65</text><text x="60" y="86" text-anchor="middle" class="small">40</text><text x="100" y="86" text-anchor="middle" class="small">—</text><text x="140" y="86" text-anchor="middle" class="small">30</text>
    <text x="20" y="118" text-anchor="middle" class="small">35</text><text x="60" y="118" text-anchor="middle" class="small">45</text><text x="100" y="118" text-anchor="middle" class="small">70</text><text x="140" y="118" text-anchor="middle" class="small">—</text>
  </g>
  <text x="620" y="228" class="small">green = row wins</text><text x="620" y="250" class="small">red = row loses</text>

  <path d="M680 235 H755" class="arrow"/>

  <!-- Mixture -->
  <text x="770" y="130" class="head">3. Current mixture</text>
  <rect x="770" y="150" width="380" height="170" rx="8" class="box"/>
  <text x="790" y="180" class="body">A lottery over complete opponents</text>
  <circle cx="820" cy="225" r="22" fill="#ef7770" class="strategy"/><text x="855" y="231" class="weight">Strategy A: 50%</text>
  <circle cx="820" cy="270" r="22" fill="#ad86e8" class="strategy"/><text x="855" y="276" class="weight">Strategy C: 30%</text>
  <circle cx="995" cy="250" r="22" fill="#70caa9" class="strategy"/><text x="1030" y="256" class="weight">Strategy F: 20%</text>
  <text x="790" y="307" class="small">All other known strategies currently have 0% weight.</text>

  <rect x="1190" y="150" width="370" height="170" rx="8" class="soft"/>
  <text x="1210" y="180" class="head">What “mixture” means</text>
  <text x="1210" y="215" class="body">For 100 evaluation games:</text>
  <text x="1230" y="246" class="body">50 games vs A</text>
  <text x="1230" y="274" class="body">30 games vs C</text>
  <text x="1230" y="302" class="body">20 games vs F</text>

  <!-- Candidate search -->
  <path d="M925 325 V385" class="arrow"/>
  <text x="40" y="415" class="head">4. Search for one strategy that performs best against that fixed lottery</text>
  <rect x="40" y="440" width="420" height="190" rx="8" class="box"/>
  <text x="60" y="472" class="body">Generate 100 candidates</text>
  <text x="60" y="497" class="small">Mutations + fresh random restarts</text>
  <g fill="#87999e">
    <circle cx="75" cy="535" r="6"/><circle cx="98" cy="535" r="6"/><circle cx="121" cy="535" r="6"/><circle cx="144" cy="535" r="6"/><circle cx="167" cy="535" r="6"/><circle cx="190" cy="535" r="6"/><circle cx="213" cy="535" r="6"/><circle cx="236" cy="535" r="6"/><circle cx="259" cy="535" r="6"/><circle cx="282" cy="535" r="6"/><circle cx="305" cy="535" r="6"/><circle cx="328" cy="535" r="6"/><circle cx="351" cy="535" r="6"/><circle cx="374" cy="535" r="6"/><circle cx="397" cy="535" r="6"/><circle cx="420" cy="535" r="6"/>
    <circle cx="75" cy="560" r="6"/><circle cx="98" cy="560" r="6"/><circle cx="121" cy="560" r="6"/><circle cx="144" cy="560" r="6"/><circle cx="167" cy="560" r="6"/><circle cx="190" cy="560" r="6"/><circle cx="213" cy="560" r="6"/><circle cx="236" cy="560" r="6"/><circle cx="259" cy="560" r="6"/><circle cx="282" cy="560" r="6"/><circle cx="305" cy="560" r="6"/><circle cx="328" cy="560" r="6"/><circle cx="351" cy="560" r="6"/><circle cx="374" cy="560" r="6"/><circle cx="397" cy="560" r="6"/><circle cx="420" cy="560" r="6"/>
  </g>
  <text x="60" y="602" class="body">Each candidate gets the same total game budget</text>
  <text x="60" y="622" class="small">Opponents are allocated 50% A / 30% C / 20% F.</text>

  <path d="M465 535 H540" class="arrow"/>
  <text x="502" y="518" text-anchor="middle" class="small">take best</text>

  <rect x="555" y="440" width="225" height="190" rx="8" class="box"/>
  <text x="575" y="472" class="head">Best response D</text>
  <circle cx="667" cy="530" r="40" fill="#e891bb" class="strategy"/><text x="667" y="537" text-anchor="middle" class="head">D</text>
  <text x="575" y="592" class="body">D beats the lottery by 8%</text>
  <text x="575" y="617" class="small">Add D because improvement is significant.</text>

  <path d="M785 535 H860" class="arrow"/>

  <rect x="875" y="440" width="685" height="190" rx="8" class="box"/>
  <text x="895" y="472" class="head">Add one row and column, then recalculate</text>
  <text x="895" y="502" class="body">New mixture example:</text>
  <circle cx="925" cy="548" r="22" fill="#ef7770" class="strategy"/><text x="960" y="554" class="weight">A: 20%</text>
  <circle cx="1060" cy="548" r="22" fill="#ad86e8" class="strategy"/><text x="1095" y="554" class="weight">C: 25%</text>
  <circle cx="1195" cy="548" r="22" fill="#e891bb" class="strategy"/><text x="1230" y="554" class="weight">D: 55%</text>
  <text x="895" y="605" class="small">Old strategies remain in the matrix. Their weights can return later.</text>

  <path d="M1115 635 V685 H250 V650" class="arrow"/>
  <text x="680" y="678" text-anchor="middle" class="body">Repeat with the new mixture until repeated searches find no meaningful improvement</text>

  <!-- Final -->
  <rect x="40" y="735" width="1520" height="125" rx="8" class="soft"/>
  <text x="60" y="770" class="head">Final result</text>
  <text x="60" y="805" class="body">If one strategy dominates: its mixture weight becomes 100%.</text>
  <text x="60" y="835" class="body">If strategies counter each other: the positive-weight strategies and their percentages are the stable competitive set.</text>
  <text x="880" y="800" class="body">Important limitation:</text>
  <text x="880" y="827" class="small">Our search is approximate. Random restarts reduce dependence on the starting set,</text>
  <text x="880" y="849" class="small">but cannot prove that no undiscovered strategy exists.</text>
</svg>
